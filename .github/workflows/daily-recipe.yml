name: Daily Recipe Generator

on:
  schedule:
    - cron: '0 13 * * *'  # 8:00 AM EST  — Breakfast
    - cron: '0 17 * * *'  # 12:00 PM EST — Lunch
    - cron: '0 23 * * *'  # 6:00 PM EST  — Dinner
    - cron: '0 1 * * *'   # 8:00 PM EST  — Dessert
  workflow_dispatch:
    inputs:
      meal_type:
        description: 'Meal type to generate'
        required: false
        default: 'any'
        type: choice
        options:
          - any
          - breakfast
          - lunch
          - dinner
          - dessert

jobs:
  generate-recipe:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pillow (for pinterest.jpg)
        run: pip install Pillow --break-system-packages

      - name: Determine meal type
        id: meal
        run: |
          HOUR=$(date -u +%H)
          INPUT_TYPE="${{ github.event.inputs.meal_type }}"
          if [ -n "$INPUT_TYPE" ] && [ "$INPUT_TYPE" != "any" ]; then
            echo "type=$INPUT_TYPE" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "13" ]; then
            echo "type=breakfast" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "17" ]; then
            echo "type=lunch" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "23" ]; then
            echo "type=dinner" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "01" ]; then
            echo "type=dessert" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "type=any" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate recipe and image
        if: steps.meal.outputs.skip != 'true'
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEAL_TYPE: ${{ steps.meal.outputs.type }}
          MEAL_PLANNER_BOOST_MULTIPLIER: "2"
          PINTEREST_INTEREST_BOOST_ENABLED: "true"
          WEEKLY_QUOTA_WINDOW: "7"
          WEEKLY_MEAL_PLANNER_MIN: "1"
          WEEKLY_SOUP_SALAD_MIN: "1"
        run: |
          echo "🍽️ Generating $MEAL_TYPE recipe..."
          node scripts/generate-recipe.js 2>&1
          # Save the slug of the new recipe for Pinterest
          echo "slug=$(node -e 'const r=require("./recipes-data.json");console.log(r[0].slug)')" >> $GITHUB_OUTPUT

      - name: Commit and push new recipe
        if: steps.meal.outputs.skip != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Improv Oven Bot"
          git add -A
          git stash
          git pull --rebase origin main || (git rebase --abort && git reset --hard origin/main && git stash pop && git add -A)
          git stash pop || true
          git add -A
          git diff --staged --quiet || git commit -m "🍳 ${{ steps.meal.outputs.type }} recipe: $(date +'%Y-%m-%d')"
          git push

      - name: Wait for Cloudflare to deploy
        if: steps.meal.outputs.skip != 'true'
        run: |
          echo "⏳ Waiting 90 seconds for Cloudflare to deploy..."
          sleep 90

      - name: IndexNow (new recipe URL)
        if: steps.meal.outputs.skip != 'true'
        continue-on-error: true
        run: |
          SLUG="${{ steps.generate.outputs.slug }}"
          node scripts/submit-indexnow.js "https://www.improvoven.com/recipes/${SLUG}/"

      - name: Refresh Pinterest Access Token
        if: steps.meal.outputs.skip != 'true'
        id: pinterest_token
        env:
          PINTEREST_APP_ID: "1554854"
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.PINTEREST_GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "🔄 Refreshing Pinterest access token..."
          node -e "
            const https = require('https');

            const appId = process.env.PINTEREST_APP_ID;
            const appSecret = process.env.PINTEREST_APP_SECRET;
            const refreshToken = process.env.PINTEREST_REFRESH_TOKEN;

            if (!refreshToken) {
              console.error('❌ No PINTEREST_REFRESH_TOKEN found in secrets');
              process.exit(1);
            }

            const body = new URLSearchParams({
              grant_type: 'refresh_token',
              refresh_token: refreshToken,
            }).toString();

            const credentials = Buffer.from(appId + ':' + appSecret).toString('base64');

            const options = {
              hostname: 'api.pinterest.com',
              path: '/v5/oauth/token',
              method: 'POST',
              headers: {
                'Authorization': 'Basic ' + credentials,
                'Content-Type': 'application/x-www-form-urlencoded',
                'Content-Length': Buffer.byteLength(body),
              },
            };

            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try {
                  const token = JSON.parse(data);
                  if (token.access_token) {
                    console.log('✅ Token refreshed successfully');
                    // Write new access token to GITHUB_OUTPUT so next steps can use it
                    const fs = require('fs');
                    fs.appendFileSync(process.env.GITHUB_OUTPUT, 'access_token=' + token.access_token + '\n');

                    // Update the secret in GitHub via API so it stays fresh for next run
                    const newRefresh = token.refresh_token || refreshToken;
                    updateGitHubSecret('PINTEREST_ACCESS_TOKEN', token.access_token)
                      .then(() => updateGitHubSecret('PINTEREST_REFRESH_TOKEN', newRefresh))
                      .then(() => console.log('✅ GitHub Secrets updated automatically'))
                      .catch(e => console.warn('⚠️ Could not auto-update secrets:', e.message));
                  } else {
                    console.error('❌ Token refresh failed:', JSON.stringify(token));
                    process.exit(1);
                  }
                } catch(e) {
                  console.error('❌ Parse error:', data);
                  process.exit(1);
                }
              });
            });

            req.on('error', e => { console.error('❌', e.message); process.exit(1); });
            req.write(body);
            req.end();

            async function updateGitHubSecret(secretName, secretValue) {
              // Get repo public key for encrypting the secret
              const keyData = await ghRequest('GET', '/repos/' + process.env.GH_REPO + '/actions/secrets/public-key');
              const { sodium } = await import('https://esm.sh/libsodium-wrappers@0.7.11');
              await sodium.ready;
              const key = sodium.from_base64(keyData.key, sodium.base64_variants.ORIGINAL);
              const msg = sodium.from_string(secretValue);
              const encrypted = sodium.crypto_box_seal(msg, key);
              const encryptedB64 = sodium.to_base64(encrypted, sodium.base64_variants.ORIGINAL);
              await ghRequest('PUT', '/repos/' + process.env.GH_REPO + '/actions/secrets/' + secretName, {
                encrypted_value: encryptedB64,
                key_id: keyData.key_id,
              });
            }

            function ghRequest(method, path, body) {
              return new Promise((resolve, reject) => {
                const data = body ? JSON.stringify(body) : null;
                const opts = {
                  hostname: 'api.github.com',
                  path,
                  method,
                  headers: {
                    'Authorization': 'Bearer ' + process.env.GH_TOKEN,
                    'Accept': 'application/vnd.github+json',
                    'User-Agent': 'improvoven-bot',
                    'X-GitHub-Api-Version': '2022-11-28',
                    ...(data ? { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data) } : {}),
                  },
                };
                const r = https.request(opts, res => {
                  let d = '';
                  res.on('data', c => d += c);
                  res.on('end', () => resolve(d ? JSON.parse(d) : {}));
                });
                r.on('error', reject);
                if (data) r.write(data);
                r.end();
              });
            }
          "

      - name: Post to Pinterest
        if: steps.meal.outputs.skip != 'true'
        env:
          PINTEREST_ACCESS_TOKEN: ${{ steps.pinterest_token.outputs.access_token }}
          PINTEREST_MAX_RETRIES: "3"
          PINTEREST_RETRY_BASE_DELAY_MS: "5000"
        run: |
          echo "📌 Posting to Pinterest..."
          SLUG="${{ steps.generate.outputs.slug }}"
          node -e "
            const { postToPinterest } = require('./scripts/pinterest-post.js');
            const recipes = require('./recipes-data.json');
            const recipe = recipes.find(r => r.slug === '$SLUG') || recipes[0];
            postToPinterest(recipe, recipe.slug)
              .then(() => console.log('✅ Posted to Pinterest!'))
              .catch(e => { console.error('❌ Pinterest failed:', e.message); process.exit(1); });
          "

      - name: Post Video Pin to Pinterest
        if: steps.meal.outputs.skip != 'true'
        continue-on-error: true
        env:
          PINTEREST_ACCESS_TOKEN: ${{ steps.pinterest_token.outputs.access_token }}
          PINTEREST_ENABLE_VIDEO_PINS: ${{ vars.PINTEREST_ENABLE_VIDEO_PINS }}
        run: |
          echo "🎬 Checking if video pin should run..."
          if [ "${PINTEREST_ENABLE_VIDEO_PINS}" != "true" ]; then
            echo "⏭️ Video pins disabled (set repo variable PINTEREST_ENABLE_VIDEO_PINS=true to enable)"
            exit 0
          fi

          RECIPE_COUNT=$(node -e "console.log(require('./recipes-data.json').length)")
          echo "Total recipes: $RECIPE_COUNT"

          # Post a video pin every 5 recipes (to avoid spam + duplication with static pins)
          if [ $((RECIPE_COUNT % 5)) -ne 0 ]; then
            echo "⏭️ Skipping video pin this run (recipe #$RECIPE_COUNT)"
            exit 0
          fi

          echo "📹 Installing ffmpeg + fonts (drawtext needs a TTF)..."
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

          echo "📹 Installing Node deps..."
          npm install --no-save form-data

          SLUG="${{ steps.generate.outputs.slug }}"
          node -e "
            const { createAndPostVideoPin } = require('./scripts/create-video-pin.js');
            const recipes = require('./recipes-data.json');
            const recipe = recipes.find(r => r.slug === '$SLUG') || recipes[0];
            createAndPostVideoPin(recipe, recipe.slug)
              .then(() => console.log('✅ Video pin posted!'))
              .catch(err => { console.error('❌ Video pin error:', err.message); process.exit(1); });
          "

      - name: Post to Instagram
        if: steps.meal.outputs.skip != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          echo "📸 Posting to Instagram..."
          SLUG="${{ steps.generate.outputs.slug }}"
          node -e "
            const { postToInstagram } = require('./scripts/instagram-post.js');
            const recipes = require('./recipes-data.json');
            const recipe = recipes.find(r => r.slug === '$SLUG') || recipes[0];
            postToInstagram(recipe, recipe.slug)
              .then(() => console.log('✅ Posted to Instagram!'))
              .catch(e => console.log('⚠ Instagram failed:', e.message));
          " 2>&1
